name: Build APK

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Rilis Terbaru (Auto-build)"
          body: "Pembaruan otomatis dari branch utama pada commit ${{ github.sha }}."
          draft: false
          prerelease: false
          overwrite: true
          files: build/app/outputs/flutter-apk/app-release.apk
